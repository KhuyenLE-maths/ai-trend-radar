# Rule specs cho phân loại (mục 10.1) — sửa file này qua PR, không cần deploy lại code.
# Mỗi rule: điểm = 3×(topic match) + 2×(keyword match) + 10×(known repo). Điểm >= threshold → gán category.

- category: foundation-models
  any_topics: [llama, foundation-models, large-language-models, pretrained-models, diffusion-models, stable-diffusion]
  any_keywords: ["foundation model", "pretrained model", "open-weight", "weights release", "language model family"]
  known_repos: [meta-llama/llama, QwenLM/Qwen, google-deepmind/gemma, deepseek-ai/DeepSeek-V3, mistralai/mistral-inference]
  threshold: 3

- category: agent-framework
  any_topics: [agents, ai-agents, multi-agent, agentic-ai, agent-framework, autonomous-agents]
  any_keywords: ["agent framework", "multi-agent", "agent orchestration", "autonomous agent", "build agents", "agentic workflow"]
  known_repos: [langchain-ai/langgraph, microsoft/autogen, crewAIInc/crewAI, openai/openai-agents-python, google/adk-python, Significant-Gravitas/AutoGPT]
  threshold: 3

- category: llm-framework
  any_topics: [langchain, llm-framework, llm-apps]
  any_keywords: ["llm framework", "llm application", "llm app framework", "orchestration framework", "prompt pipeline"]
  known_repos: [langchain-ai/langchain, run-llama/llama_index, deepset-ai/haystack, stanfordnlp/dspy]
  threshold: 3

- category: mcp
  any_topics: [mcp, model-context-protocol, mcp-server, mcp-client]
  any_keywords: ["mcp server", "mcp client", "model context protocol"]
  known_repos: [modelcontextprotocol/servers]
